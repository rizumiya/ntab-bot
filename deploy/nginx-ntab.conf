# NTAB Telegram bot -- image proxy. Proses: ntab-bot.service (systemd) di 127.0.0.1:3080.
# Hanya /proxy/img yang diteruskan; URL-nya wajib bertanda tangan bot, jadi tidak bisa dipakai pihak luar.
# Pasang sebagai /etc/nginx/sites-available/ntab lalu tautkan ke sites-enabled.

server {
    listen 80;
    listen [::]:80;
    server_name ntab.snobadev.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ntab.snobadev.com;

    ssl_certificate     /etc/letsencrypt/live/ntab.snobadev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ntab.snobadev.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=15552000" always;

    access_log /var/log/nginx/ntab.access.log;
    error_log  /var/log/nginx/ntab.error.log;

    location = /proxy/img {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
